<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Osiris</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#f5f3ee" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <header class="site-header">
    <nav class="nav">
      <div class="nav-logo">
        <a href="/index.html"><span class="logo-text">OSIRIS</span></a>
      </div>
      <button class="nav-toggle" aria-label="Toggle menu" aria-controls="nav-menu" aria-expanded="false">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <ul class="nav-links" id="nav-menu">
        <li><a href="/index.html#thesis">Thesis</a></li>
        <li><a href="/index.html#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="imprint-section">
      <div class="container">
        <div class="section-label">Error 404</div>
        <h1 class="imprint-headline">Page not<br /><em>found</em></h1>
        <p class="notfound-text">
          The page you were looking for does not exist, or has moved.
          <a href="/index.html">Return to the homepage</a>.
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="footer-logo">OSIRIS</span>
      <span class="footer-copy">&copy; 2026 Osiris. All rights reserved. &ensp;&middot;&ensp; <a href="/imprint.html">Imprint</a></span>
    </div>
  </footer>

  <script>
    // Mobile nav toggle
    const navToggle = document.querySelector('.nav-toggle');
    const navMenu = document.getElementById('nav-menu');
    if (navToggle && navMenu) {
      navToggle.addEventListener('click', () => {
        const open = navMenu.classList.toggle('is-open');
        navToggle.setAttribute('aria-expanded', open);
      });
      navMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
        navMenu.classList.remove('is-open');
        navToggle.setAttribute('aria-expanded', 'false');
      }));
    }
  </script>

</body>
</html>
